name: Bug
description: Сообщить об ошибке
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия / коммит
  - type: textarea
    id: logs
    attributes:
      label: Логи
      render: shell
