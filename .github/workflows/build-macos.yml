name: Build macOS

# Наука: GitHub Actions macos-latest, PyInstaller BUNDLE
on:
  push:
    branches: [master]
    paths:
      - 'packaging/macos/**'
      - 'aura/**'
      - 'aura_main.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build .app
        run: |
          cd packaging/macos
          pyinstaller --clean --noconfirm aura.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-macos-app
          path: packaging/macos/dist/Aura.app
          if-no-files-found: warn
          retention-days: 14
