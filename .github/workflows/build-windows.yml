name: Build Windows

# Наука: GitHub Actions windows-latest, PyInstaller, MSVC
on:
  push:
    branches: [master]
    paths:
      - 'packaging/windows/**'
      - 'aura/**'
      - 'aura_main.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build .exe
        run: |
          cd packaging/windows
          pyinstaller --clean --noconfirm aura.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-windows-exe
          path: packaging/windows/dist/aura/
          if-no-files-found: warn
          retention-days: 14
