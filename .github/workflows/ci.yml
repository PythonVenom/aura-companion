name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev python3-dev build-essential
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          pytest tests/ -q --tb=short \
            --ignore=tests/test_mouse.py \
            --ignore=tests/test_text_editor.py \
            --ignore=tests/test_vision.py \
            --ignore=tests/test_bootstrap.py

  cross-platform-import:
    name: Cross-platform imports
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Test PAL imports
        run: |
          python -c "from aura.platform import get_audio, get_service, get_media; print('PAL ok')"
          python -c "from aura.platform import _distro, _is_ubuntu_like; print('detect ok:', _distro())"
          python -c "from aura.platform.windows import WindowsAudio; print('Win ok')"
          python -c "from aura.platform.macos import MacOSAudio; print('Mac ok')"
          python -c "from aura.platform.linux import LinuxAudio; print('Linux ok')"
          python -c "from aura.platform.ubuntu import UbuntuAudio; print('Ubuntu ok')"
          python -m pytest tests/test_pal.py tests/test_pal_windows.py tests/test_pal_macos.py -q || true
