name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev python3-dev build-essential
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e . || pip install pytest pytest-asyncio; fi
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          pytest tests/ -q --tb=short \
            --ignore=tests/test_mouse.py \
            --ignore=tests/test_text_editor.py \
            --ignore=tests/test_vision.py \
            --ignore=tests/test_bootstrap.py
