# OpenJarvis configuration
# Hardware: Intel(R) Core(TM) i7-8750H CPU @ 2.20GHz (12 cores, 31.2 GB RAM)
# Full reference config: jarvis init --full

installed_at = "2026-08-25T15:05:37Z"
installer_version = "0.0.1.dev1+unknown.gccd66d5f1"

[engine]
default = "ollama"

[engine.ollama]
# host = "http://localhost:11434"  # set to remote URL if engine runs elsewhere

[intelligence]
default_model = "qwen3.5:2b"

[agent]
default_agent = "tool"

[tools]
enabled = ["code_interpreter", "web_search", "file_read", "shell_exec", "system_time", "system_update"]

[notifications]
enabled = true
check_interval = 120
notify_file = "/tmp/jarvis_notify.txt"
