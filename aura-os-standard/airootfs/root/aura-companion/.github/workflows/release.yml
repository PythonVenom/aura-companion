name: Release AuraOS

# Наука: GitHub Releases (2013), Semantic Versioning (Preston-Werner 2011)
on:
  push:
    tags:
      - 'v*'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel archiso git sudo

      - uses: actions/checkout@v4

      - name: Build Aura Live ISO
        run: |
          cd aura-os
          ./build.sh
        continue-on-error: true

      - name: Build Aura Standard ISO
        run: |
          cd aura-os-standard
          ./build.sh
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auraos-isos
          path: |
            aura-os/out/*.iso
            aura-os/out/*.sha256
            aura-os-standard/out/*.iso
            aura-os-standard/out/*.sha256
          if-no-files-found: warn

  create-release:
    needs: build-iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: auraos-isos
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/*.iso
            dist/**/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
