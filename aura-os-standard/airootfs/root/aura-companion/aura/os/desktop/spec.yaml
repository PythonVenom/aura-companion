# AuraOS Desktop Specification
version: "1.3"
codename: "Aura-Ubuntu-Style"
base:
  wm: openbox
  panel: lxqt
  display_manager: sddm
  theme_gtk: "Arc-Dark"
  theme_qt: "KvGnomeDark"
  icons: "Papirus-Dark"

panel:
  position: "bottom" # <-- ПАНЕЛЬ ВНИЗУ
  height: 40
  plugins:
    - mainmenu
    - taskbar
    - desktopswitch # <-- Переключатель рабочих столов
    - statusnotifier
    - volume
    - worldclock
    - networkmonitor
    - customcommand1
    - customcommand2
    - customcommand3

custom_commands:
  customcommand1:
    command: "lxqt-config"
    text: "⚙️"
  customcommand2:
    command: "blueman-manager"
    text: ""
  customcommand3:
    command: "echo \"Aura: $(jq -r '.state' ~/.cache/aura/aura_status.json)\""
    text: "Aura: ..."
