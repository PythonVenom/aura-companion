# AuraOS Desktop Specification
version: "1.1"
codename: "Aura-GNOME-Style"
base:
  wm: openbox
  panel: lxqt
  display_manager: sddm
  theme_gtk: "Arc-Dark"
  theme_qt: "KvGnomeDark"
  icons: "Papirus-Dark"

panel:
  position: "top"
  height: 32
  plugins:
    - mainmenu
    - taskbar
    - statusnotifier
    - volume
    - worldclock
    - networkmonitor
    - customcommand1
    - customcommand2

custom_commands:
  customcommand1:
    command: "lxqt-config"
    text: "⚙️"
  customcommand2:
    command: "blueman-manager"
    text: ""
