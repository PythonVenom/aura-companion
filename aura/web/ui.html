<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Web UI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #111;
  color: #eee;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 12px 16px;
  background: #1a1a1a;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  gap: 10px;
}
.dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: #888;
  transition: background 0.2s;
}
.dot.idle { background: #5a7a9a; }
.dot.listening { background: #f5c542; }
.dot.thinking { background: #f58742; }
.dot.speaking { background: #42c55a; }
.dot.paused { background: #666; }
.dot.error { background: #c54242; }
h1 { font-size: 15px; font-weight: 600; }
.status-text { opacity: 0.7; font-size: 13px; }
main {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}
.msg { margin-bottom: 12px; display: flex; }
.msg.user { justify-content: flex-end; }
.bubble {
  padding: 8px 12px;
  border-radius: 12px;
  max-width: 75%;
  word-wrap: break-word;
  font-size: 14px;
  line-height: 1.4;
}
.msg.user .bubble { background: #2a5a7a; }
.msg.aura .bubble { background: #2a2a2a; }
footer {
  padding: 12px 16px;
  background: #1a1a1a;
  border-top: 1px solid #333;
  display: flex;
  gap: 8px;
}
input[type=text] {
  flex: 1;
  padding: 10px 14px;
  background: #222;
  border: 1px solid #333;
  border-radius: 8px;
  color: #eee;
  font-size: 14px;
}
input[type=text]:focus { outline: none; border-color: #42c55a; }
button {
  padding: 10px 18px;
  background: #42c55a;
  border: none;
  border-radius: 8px;
  color: #111;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
}
button:hover { background: #4dd66a; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>Aura</h1>
  <span class="status-text" id="status">загрузка...</span>
</header>
<main id="chat"></main>
<footer>
  <input type="text" id="input" placeholder="Написать Aura..." autofocus>
  <button id="send">→</button>
</footer>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const dot = document.getElementById("dot");
const statusEl = document.getElementById("status");

async function loadHistory() {
  try {
    const r = await fetch("/chat/history?limit=50");
    const list = await r.json();
    chat.innerHTML = "";
    for (const m of list) {
      appendMsg("user", m.user);
      appendMsg("aura", m.aura);
    }
    chat.scrollTop = chat.scrollHeight;
  } catch (e) { console.error(e); }
}

function appendMsg(who, text) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  div.appendChild(b);
  chat.appendChild(div);
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  appendMsg("user", text);
  chat.scrollTop = chat.scrollHeight;
  send.disabled = true;
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user: text})
    });
    const data = await r.json();
    appendMsg("aura", data.aura || "(нет ответа)");
  } catch (e) {
    appendMsg("aura", "❌ Ошибка: " + e);
  }
  send.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

async function pollStatus() {
  try {
    const r = await fetch("/status");
    const s = await r.json();
    dot.className = "dot " + (s.state || "unknown");
    statusEl.textContent = s.state || "unknown";
  } catch (e) {}
}

send.addEventListener("click", sendMsg);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });

loadHistory();
pollStatus();
setInterval(pollStatus, 2000);
</script>
</body>
</html>
