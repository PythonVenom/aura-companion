# Aura + Ollama (T075)
version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  aura:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - AURA_CACHE_DIR=/data/cache
      - AURA_CONFIG_DIR=/data/config
    volumes:
      - aura_data:/data
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse:/run/pulse:ro
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    restart: unless-stopped

volumes:
  ollama_data:
  aura_data:
