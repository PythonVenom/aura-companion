[project]
name = "aura"
version = "0.1.0"
description = "Локальный ИИ-компаньон для семьи. Приватность, память, кроссплатформенность."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pythonvenom" }]

dependencies = [
    # Core
    "pydantic>=2.0",
    "platformdirs>=4.0",
    # RAG
    "chromadb>=1.5",
    # ASR / TTS
    "sherpa-onnx>=1.13",
    "piper-tts>=1.8",
    "sounddevice>=0.5",
    "webrtcvad>=2.0",
    "numpy>=2.0",
    # HTTP
    "requests>=2.30",
    # GUI automation
    "pyautogui>=0.9",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true


[tool.coverage.run]
source = ["aura"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
