[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-companion"
version = "1.0.0-rc1"
description = "Local voice AI companion for elder care. Open source, no cloud."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "PythonVenom", email = "noreply@github.com"}]
requires-python = ">=3.10"
keywords = ["ai", "voice", "elder-care", "russian", "local-first", "accessibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "cryptography>=41.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
    "sherpa-onnx>=1.9",
    "sounddevice>=0.4",
    "webrtcvad>=2.0",
    "chromadb==0.5.23",  # без Rust FFI (segfault fix)
    "numpy>=1.26,<2.0",  # совместим с chromadb 0.5.23
    "httpx>=0.27",
    "jinja2>=3.1",
    "psutil>=6.0",
    "setuptools<81",  # pkg_resources для webrtcvad
    "python-multipart>=0.0.9",  # FastAPI Form
]

[project.optional-dependencies]
tts = ["piper-tts", "ruaccent>=1.0", "razdel>=0.5"]
dev = ["pytest>=8.0", "ruff", "mypy"]

[project.scripts]
aura = "aura.cli:main"
aura-backup = "tools.aura_backup:main"

[project.urls]
Homepage = "https://github.com/PythonVenom/aura-companion"
Issues = "https://github.com/PythonVenom/aura-companion/issues"
Changelog = "https://github.com/PythonVenom/aura-companion/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["aura"]

[tool.hatch.build.targets.sdist]
include = ["aura/", "README.md", "LICENSE", "pyproject.toml"]

# ═══════════════════════════════════════════════════════════════
# Ruff — линтер (F-020)
# ═══════════════════════════════════════════════════════════════
# Наука (Д4): раздел 19 промта — конфиг как код, обоснованные ignore.
# Ruff docs: https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv", ".venv", "build", "dist", ".git", "aura-os", "aura-os-standard", "aura/attic"]

[tool.ruff.lint]
# Базовый набор: E (pycodestyle), F (Pyflakes), I (isort),
# UP (pyupgrade), B (bugbear), SIM (simplify), RUF (ruff), S (bandit)
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

# Осознанные ignore (с обоснованием — раздел 19 промта):
# E501  — line-too-long: используем 100, но длинные строки-сообщения оставляем
# BLE001 — blind-except: у нас 458 осознанных `except Exception as e`
#         с logging (F-006). Строгое правило даёт шум.
# RUF012 — mutable-class-default: наши агенты — MicroAgent со
#         class-level TRIGGERS/SOS_PHRASES (это осознанный дизайн)
# DTZ005/6/7 — datetime without tz: локальное время — норма для elder-care
# PLW1510 — subprocess without check: используем check=False осознанно
# S110/S112 — try-except-pass/continue: в swallow-ok (platform_adapters)
#             + logging (некоторые остались)
ignore = [
    "E501",     # long lines: сообщения об ошибках бывают длинными
    "BLE001",   # blind-except: 458 осознанных с logging (F-006)
    "RUF012",   # mutable-class-default: MicroAgent TRIGGERS (дизайн)
    "DTZ005", "DTZ006", "DTZ007", "DTZ001",  # naive datetime для elder-care
    "PLW1510",  # subprocess check=False осознанно
    "S110", "S112",  # try-except-pass/continue в swallow-ok + logging
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode: русский текст
    "E701",     # multiple-statements-colon: `if x: return` (defensive)
    "E702",     # multiple-statements-semicolon
    "E402",     # module-import-not-at-top: sys.path.insert перед imports (осознанно)
    "E741",     # ambiguous-variable: l/I/O — допустимо в русском коде
    "SIM102",   # collapsible-if: defensive-стиль читается лучше
    "SIM115",   # open-without-with: долгоживущие handles (pystray, sqlite)
    "B904",     # raise-without-from: контекст исключения не нужен
    "RUF059",   # unused-unpacked-var: распаковка для читаемости
    "E731",     # lambda-assignment: короткие лямбды в callback
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "DTZ", "RUF", "SIM", "UP"]
"aura/platform_adapters/**" = ["S110", "S112", "BLE001"]
"aura/platform/**" = ["S110", "S112", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["aura"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ═══════════════════════════════════════════════════════════════
# Mypy — статическая типизация (F-019)
# ═══════════════════════════════════════════════════════════════
# Наука (Д4): раздел 19 промта — обоснованные ignore.
# Раздел 25 — не гонимся за 100% coverage, критичное типизировано.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = false
disallow_untyped_defs = false
follow_imports = "skip"
# #126: baseline — только новые модули с аннотациями.
# Старые 78 агентов работают → не трогаем (Beck 1999, XP).
files = [
    "aura/core/notifications.py",
    "aura/core/ledger.py",
    "aura/core/profile.py",
    "aura/core/fdir.py",
    "aura/core/migrations.py",
    "aura/core/api_version.py",
    "aura/core/rules.py",
    "aura/core/recall_log.py",
    "aura/core/rate_limit.py",
    "aura/core/canbus.py",
    "aura/core/curiosity.py",
    "aura/core/plugin_registry.py",
]

# Windows-only модули (mypy на Linux не знает их API)
[[tool.mypy.overrides]]
module = ["aura.os_features.windows", "aura.platform_adapters.windows"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "telegram.*",
    "vosk.*",
    "piper.*",
    "sherpa_onnx.*",
    "chromadb.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aura.platform.windows", "aura.os_features.windows"]
ignore_errors = true

# ChromaDB, pystray, vlc — динамические библиотеки без полных stub
[[tool.mypy.overrides]]
module = ["aura.agents.rag_memory", "aura.core.memory.*", "aura.core.tray"]
ignore_errors = true

# Опциональные зависимости
[[tool.mypy.overrides]]
module = ["aura.wrappers.*", "aura.agents.mouse", "aura.agents.text_editor"]
ignore_errors = true

[tool.pytest.ini_options]
markers = [
    "unit: быстрые изолированные тесты",
    "integration: тесты нескольких модулей",
    "e2e: end-to-end тесты",
    "smoke: критичный минимум для CI",
]
